name: NIFTY historical archive integrity audit

on:
  workflow_dispatch:
    inputs:
      max_archives:
        description: "Maximum existing ZIP archives to download and verify in this run"
        required: true
        default: "1"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: nse-b2-archive
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      B2_ENDPOINT_URL: ${{ secrets.B2_ENDPOINT_URL }}
      B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Restore resumable audit checkpoint
        id: audit_cache
        uses: actions/cache@v4
        with:
          path: data/historical_audit/
          key: nifty-historical-audit-v1-${{ github.run_id }}
          restore-keys: |
            nifty-historical-audit-v1-

      - name: Recover checkpoint from previous audit artifact
        if: steps.audit_cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: nifty-historical-audit-43691154808
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 43691154808
          path: data

      - name: Install lightweight audit dependencies
        run: pip install -r requirements-audit.txt

      - name: Verify B2 configuration without printing secrets
        run: |
          python - <<'PY'
          import os
          required = ["B2_ENDPOINT_URL", "B2_APPLICATION_KEY_ID", "B2_APPLICATION_KEY", "B2_BUCKET_NAME"]
          missing = [key for key in required if not os.getenv(key)]
          if missing:
              raise SystemExit("Historical audit blocked; missing secrets: " + ", ".join(missing))
          print("B2 configuration is present.")
          PY

      - name: Verify one bounded batch of existing archives (read-only)
        run: |
          set -euo pipefail
          python scripts/nse_historical_audit.py \
            --start 2024-11-12 \
            --end 2026-11-12 \
            --checkpoint data/historical_audit/checkpoint.json \
            --max-archives "${{ inputs.max_archives }}"

      - name: Publish audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nifty-historical-audit-${{ github.run_id }}
          path: data/historical_audit/
          if-no-files-found: ignore
          retention-days: 30
