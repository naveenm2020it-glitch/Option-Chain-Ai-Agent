name: NIFTY Range-Only Research Tuning
# Re-verify the current Range candidate after the shadow artifact log assertion fix.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scripts/tune_nifty_range_only.py"
      - "scripts/range_research_benchmark.py"
      - "scripts/range_model_bundle.py"
      - "scripts/build_nifty_range_bundle.py"
      - "scripts/train_nifty_four_models.py"
      - "tests/test_range_model_bundle.py"
      - "tests/test_nse_workflow_config.py"
      - "requirements-four-models.txt"
      - ".github/workflows/nifty-range-only-tuning.yml"
  push:
    branches:
      - model-tuning/**
    paths:
      - "scripts/tune_nifty_range_only.py"
      - "scripts/range_research_benchmark.py"
      - "scripts/range_model_bundle.py"
      - "scripts/build_nifty_range_bundle.py"
      - "scripts/train_nifty_four_models.py"
      - "tests/test_range_model_bundle.py"
      - "tests/test_nse_workflow_config.py"
      - "requirements-four-models.txt"
      - ".github/workflows/nifty-range-only-tuning.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: nifty-range-only-tuning
  cancel-in-progress: true

jobs:
  range-only:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Restore verified historical audit
        uses: actions/download-artifact@v4
        with:
          name: nifty-historical-audit-43691154808
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 43691154808
          path: data

      - name: Restore repaired 494-session checkpoint
        uses: actions/download-artifact@v4
        with:
          name: nifty-context-repair-43805612526
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 43805612526
          path: data

      - name: Verify archive and zero-B2 policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          checkpoint = json.loads(Path("data/historical_audit/checkpoint.json").read_text())
          audit = json.loads(Path("data/historical_audit/coverage.json").read_text())
          repair = json.loads(Path("data/context_repair/context_repair_report.json").read_text())
          assert len(checkpoint.get("features", {})) == 494
          assert audit.get("model_training_allowed") is True
          assert repair.get("training_allowed") is True
          assert repair.get("repair_complete") is True
          assert repair.get("date_alignment_pass") is True
          assert repair.get("feature_validation", {}).get("pass") is True
          assert repair.get("missing_context_dates") == {}
          assert repair.get("b2_requests") == 0
          print("494/494 archive verified; B2 requests: 0")
          PY

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-four-models.txt
          pip install "pytest>=8,<9"

      - name: Run Range shadow and workflow regression tests
        run: |
          python -m compileall -q scripts/range_model_bundle.py scripts/range_research_benchmark.py scripts/range_shadow_validation.py scripts/build_nifty_range_bundle.py
          python -m pytest -q tests/test_range_model_bundle.py tests/test_nse_workflow_config.py

      - name: Run Range Intelligence tuning only
        run: |
          python scripts/tune_nifty_range_only.py \
            --checkpoint data/historical_audit/checkpoint.json \
            --audit-report data/historical_audit/coverage.json \
            --repair-report data/context_repair/context_repair_report.json \
            --output models/tuning_artifacts/range_only_report.json

      - name: Enforce research-only gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("models/tuning_artifacts/range_only_report.json").read_text())
          assert report["status"] == "range_only_tuning_complete"
          assert report["model_group"] == "Range Intelligence"
          assert report["other_models_tuned"] is False
          assert report["b2_reads"] == 0 and report["b2_writes"] == 0
          assert report["deployment_ready"] is False
          assert report["range"]["cv_beats_baseline"] is True
          assert report["range"]["selected_minimum_fold_full_range_coverage"] >= 0.70
          assert report["range"]["selected_calibration_alpha"] == 0.10
          print("Range-only workflow: PASS")
          print("CV beats baseline:", report["range"]["cv_beats_baseline"])
          print("Selected config:", report["range"]["selected_config"])
          print("CV pinball:", report["range"]["selected_cv_combined_pinball"])
          print("Baseline CV pinball:", report["range"]["baseline_cv_combined_pinball"])
          print("CV Winkler improvement (%):", report["range"]["cv_winkler_improvement_pct"])
          print("CV full-range coverage:", report["range"]["cv_full_range_coverage"])
          print("Holdout diagnostic beats baseline:", report["range"]["holdout_diagnostic_beats_baseline"])
          print("B2 reads/writes:", report["b2_reads"], report["b2_writes"])
          PY

      - name: Build calibrated research-only Range candidate bundle
        run: |
          python scripts/build_nifty_range_bundle.py \
            --checkpoint data/historical_audit/checkpoint.json \
            --audit-report data/historical_audit/coverage.json \
            --repair-report data/context_repair/context_repair_report.json \
            --tuning-report models/tuning_artifacts/range_only_report.json \
            --output-dir models/artifacts

      - name: Smoke-test fitted Range bundle on latest verified archive features
        run: |
          python - <<'PY'
          import json
          import joblib
          import numpy as np
          from pathlib import Path
          from scripts.range_model_bundle import predict_range_bundle
          from scripts.train_nifty_four_models import build_latest_inference_features

          checkpoint = json.loads(Path("data/historical_audit/checkpoint.json").read_text())
          rows = checkpoint["features"]
          latest_date = max(rows)
          features = build_latest_inference_features(rows)
          bundle = joblib.load("models/artifacts/nifty_range_candidate.joblib")
          forecast = predict_range_bundle(bundle, features)
          values = np.asarray([
              forecast["low_return"], forecast["high_return"], forecast["close_return"]
          ], dtype=float)
          assert np.isfinite(values).all()
          assert -1.0 < forecast["low_return"] < forecast["high_return"]
          assert forecast["low_return"] <= forecast["close_return"] <= forecast["high_return"]
          print("Range bundle inference smoke test: PASS")
          print("Forecast origin:", latest_date)
          print("Feature count:", len(features))
          print("Calibrated alpha:", bundle["calibration_alpha"])
          print("Predicted next-session low/high return:", forecast["low_return"], forecast["high_return"])
          PY

      - name: Verify Range candidate bundle promotion lock
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("models/artifacts")
          manifest = json.loads((root / "range_candidate_manifest.json").read_text())
          assert (root / manifest["model_file"]).is_file()
          assert manifest["cv_beats_baseline"] is True
          assert manifest["calibration_alpha"] == 0.10
          assert manifest["selected_minimum_fold_full_range_coverage"] >= 0.70
          assert manifest["forward_shadow_validation_required"] is True
          assert manifest["deployment_ready"] is False
          assert manifest["production_promotion_allowed"] is False
          assert manifest["b2_reads"] == 0 and manifest["b2_writes"] == 0
          print("Range candidate bundle: PASS")
          print("Estimator:", manifest["candidate"]["name"])
          print("Fit/calibration samples:", manifest["estimator_fit_samples"], manifest["conformal_calibration_samples"])
          print("Forward shadow validation required: True")
          print("Production promotion: BLOCKED")
          PY

      - name: Publish Range-only research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nifty-range-only-${{ github.run_id }}
          path: models/tuning_artifacts/range_only_report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish calibrated Range candidate bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nifty-range-candidate-${{ github.run_id }}
          path: models/artifacts/
          if-no-files-found: error
          retention-days: 90
