name: NIFTY AI full validation

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: full-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-integration-api-regression:
    name: Unit, integration, API and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx
      - name: Compile Python modules
        run: python -m compileall -q app.py nifty_ai scripts tests
      - name: Unit, integration, API and regression suite
        env:
          PYTHONPATH: .
          NIFTY_APP_PASSWORD: ""
          NIFTY_ENABLE_WATCHER: "false"
        run: python -m pytest -q --ignore=tests/e2e
      - name: JavaScript syntax validation
        run: node --check static/app.js

  browser-e2e:
    name: Browser end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install app, API test and browser dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx playwright
          python -m playwright install --with-deps chromium
      - name: Start application
        env:
          NIFTY_APP_PASSWORD: ""
          NIFTY_ENABLE_WATCHER: "false"
        run: |
          uvicorn app:app --host 127.0.0.1 --port 8765 > /tmp/nifty-e2e.log 2>&1 &
          echo $! > /tmp/nifty-e2e.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/api/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/nifty-e2e.log
          exit 1
      - name: Exercise browser navigation and page rendering
        env:
          E2E_BASE_URL: http://127.0.0.1:8765
        run: python -m pytest -q tests/e2e
      - name: Stop application
        if: always()
        run: if [ -f /tmp/nifty-e2e.pid ]; then kill "$(cat /tmp/nifty-e2e.pid)" || true; fi

  load-performance:
    name: Local load and response-time test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Start application
        env:
          NIFTY_APP_PASSWORD: ""
          NIFTY_ENABLE_WATCHER: "false"
        run: |
          uvicorn app:app --host 127.0.0.1 --port 8765 > /tmp/nifty-load.log 2>&1 &
          echo $! > /tmp/nifty-load.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/api/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/nifty-load.log
          exit 1
      - name: Concurrent health endpoint test
        env:
          LOAD_TEST_BASE_URL: http://127.0.0.1:8765
          LOAD_TEST_REQUESTS: "200"
          LOAD_TEST_WORKERS: "12"
        run: python scripts/ci_load_probe.py
      - name: Stop application
        if: always()
        run: if [ -f /tmp/nifty-load.pid ]; then kill "$(cat /tmp/nifty-load.pid)" || true; fi

  static-security:
    name: Static analysis and dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install security scanners
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt bandit pip-audit
      - name: Python security static analysis
        run: bandit -q -r app.py nifty_ai scripts -lll -iii
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt

  deployed-smoke:
    name: Deployed Render smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for deployed service and verify public routes
        env:
          BASE_URL: https://nifty-next-day-ai-live.onrender.com
        run: |
          for attempt in $(seq 1 18); do
            if curl -fsS "$BASE_URL/api/health" -o /tmp/health.json; then break; fi
            echo "Render health endpoint not ready (attempt $attempt/18)"
            sleep 10
          done
          test -s /tmp/health.json
          python -c "import json; d=json.load(open('/tmp/health.json')); assert d.get('ok') is True; assert d.get('app') == 'NIFTY Next-Day AI Intelligence'; print('Health:', d)"
          curl -fsSI "$BASE_URL/" | head -n 1
          curl -fsS "$BASE_URL/static/app.js?v=phase3-3e80e725" -o /tmp/app.js
          test -s /tmp/app.js
          echo "Render health, dashboard HTML and static JavaScript routes passed."
