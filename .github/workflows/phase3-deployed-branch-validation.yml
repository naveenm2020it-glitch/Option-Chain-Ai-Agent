name: Phase 3 deployed-branch validation

on:
  push:
    branches:
      - phase3/deployed-branch-integration
  pull_request:
    branches:
      - feature/paper-trading-engine-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase3-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run Phase 3 storage tests
        run: python -m pytest -q tests/test_phase3_storage.py
