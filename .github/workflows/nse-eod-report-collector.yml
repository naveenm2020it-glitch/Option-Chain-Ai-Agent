name: Collect NSE EOD reports

on:
  push:
    branches: [main]
    paths:
      - scripts/nse_eod_collector.py
      - scripts/nse_core_eod_collector.py
      - scripts/nse_extended_eod_collector.py
      - nifty_ai/reports.py
  schedule:
    # 21:45 India time, after the NSE end-of-day report publication window.
    - cron: "15 16 * * 1-5"
  workflow_dispatch:
    inputs:
      lookback_calendar_days:
        description: "Calendar days to scan for historical gaps (default 60)"
        required: false
        default: "60"

permissions:
  contents: write

concurrency:
  group: nse-eod-report-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run unit and regression tests before collection
        env:
          PYTHONPATH: .
        run: python -m pytest -q

      - name: Collect and validate NSE reports
        env:
          PYTHONPATH: .
        run: |
          DAYS="${{ github.event.inputs.lookback_calendar_days || '60' }}"
          python scripts/nse_eod_collector.py --lookback-calendar-days "$DAYS"
          python scripts/nse_core_eod_collector.py --lookback-calendar-days "$DAYS"
          python scripts/nse_extended_eod_collector.py --lookback-calendar-days "$DAYS"

      - name: Commit newly available reports and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nse_reports
          if ! git diff --cached --quiet; then
            git commit -m "Update NSE core and participant EOD report archive"
            git push origin HEAD:main
          else
            echo "No new NSE report archive changes."
          fi
