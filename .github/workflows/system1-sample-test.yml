name: System 1 targeted / 23-session NSE source audit

on:
  push:
    branches:
      - feature/system-1-data-intelligence
    paths:
      - "system1/b2_archive.py"
      - "scripts/system1_deep_data_validation.py"
      - "tests/test_system1_b2_archive.py"
      - ".github/workflows/system1-sample-test.yml"
  workflow_dispatch:
    inputs:
      session_date:
        description: "Selected NSE trading date"
        required: true
        default: "2025-12-17"
        type: string
      audit_sessions:
        description: "Trading sessions to validate, including selected date (1 for targeted test, 23 for full audit)"
        required: true
        default: "23"
        type: choice
        options:
          - "1"
          - "23"
      archive_to_b2:
        description: "After a full PASS, upload the validated archive to Backblaze B2"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Run System 1 regression tests
        run: python -m pytest -q tests/test_system1_pipeline.py tests/test_system1_b2_archive.py
      - name: Download, parse and deeply validate catalogued NSE reports
        if: github.event_name == 'workflow_dispatch'
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_ENDPOINT_URL: ${{ secrets.B2_ENDPOINT_URL }}
          B2_REGION: ${{ secrets.B2_REGION }}
        run: |
          ARCHIVE_FLAG=""
          if [ "${{ inputs.archive_to_b2 }}" = "true" ] && [ "${{ inputs.audit_sessions || '23' }}" = "23" ]; then
            ARCHIVE_FLAG="--archive-to-b2"
          fi
          python scripts/system1_deep_data_validation.py --date "${{ inputs.session_date || '2025-12-17' }}" --sessions "${{ inputs.audit_sessions || '23' }}" $ARCHIVE_FLAG
