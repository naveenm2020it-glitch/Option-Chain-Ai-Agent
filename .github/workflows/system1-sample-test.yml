name: System 1 targeted / 23-session NSE source audit

on:
  push:
    branches:
      - feature/system-1-data-intelligence
    paths:
      - "scripts/system1_23_session_source_audit.py"
      - "scripts/system1_deep_data_validation.py"
      - ".github/workflows/system1-sample-test.yml"
  workflow_dispatch:
    inputs:
      session_date:
        description: "Selected NSE trading date"
        required: true
        default: "2025-12-17"
        type: string
      audit_sessions:
        description: "Trading sessions to validate, including selected date (1 for targeted test, 23 for full audit)"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "23"

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Download, parse and deeply validate catalogued NSE reports
        run: python scripts/system1_deep_data_validation.py --date "${{ inputs.session_date || '2025-12-17' }}" --sessions "${{ inputs.audit_sessions || '1' }}"
