name: Validate eight-agent rebuild

on:
  push:
    branches: [rebuild-eight-agent]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest
      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q

      - name: Smoke-test live Render endpoint and password removal
        run: |
          for attempt in $(seq 1 18); do
            body="$(curl -fsS https://nifty-next-day-ai-live.onrender.com/api/health)" || body=""
            if [ -n "$body" ]; then
              echo "$body"
              echo "$body" | grep -q '"auth_required":false' && exit 0
            fi
            sleep 10
          done
          echo "Render health endpoint did not confirm auth_required=false"
          exit 1

      - name: Verify deployed dashboard and unauthenticated state endpoint
        run: |
          page="$(curl -fsS https://nifty-next-day-ai-live.onrender.com/)"
          echo "$page" | grep -q 'theme-toggle'
          echo "$page" | grep -q 'ai-sr-grid'
          curl -fsS https://nifty-next-day-ai-live.onrender.com/api/state >/dev/null
          echo "Dashboard HTML and public state endpoint are responding."
