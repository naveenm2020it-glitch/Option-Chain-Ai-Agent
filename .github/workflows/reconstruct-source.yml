name: Reconstruct bundled application source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild-eight-agent
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconstruct and validate source bundle
        run: |
          python bootstrap.py
          rm -f nifty-ai-source.zip
          test -f app.py
          test -f requirements.txt
      - name: Commit reconstructed application files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -q .github/workflows/tests.yml .github/workflows/validate-rebuild.yml || true
          if ! git diff --cached --quiet; then
            git commit -m "Reconstruct bundled application source"
            git push origin rebuild-eight-agent
          fi
