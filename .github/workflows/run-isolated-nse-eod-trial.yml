name: Run isolated NIFTY EOD trial

on:
  workflow_dispatch:
    inputs:
      analysis_date:
        description: "Reference EOD date (YYYY-MM-DD)"
        required: true
        default: "2026-11-18"
        type: string
      expiry:
        description: "Expiry reference for later analysis (YYYY-MM-DD)"
        required: true
        default: "2026-11-26"
        type: string
      sessions:
        description: "Number of aligned trading sessions"
        required: true
        default: "22"
        type: choice
        options: ["5", "22"]

permissions:
  contents: read

concurrency:
  group: isolated-nifty-eod-trial
  cancel-in-progress: false

jobs:
  trial-download:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      B2_ENDPOINT_URL: ${{ secrets.B2_ENDPOINT_URL }}
      B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
    steps:
      - name: Checkout isolated trial branch only
        uses: actions/checkout@v4
        with:
          ref: trial/eod-22-session-download-2026-11-18
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install trial dependencies
        run: python -m pip install requests boto3
      - name: Download and validate EOD reports
        run: |
          python scripts/nse_eod_trial.py \
            --analysis-date "${{ inputs.analysis_date }}" \
            --expiry "${{ inputs.expiry }}" \
            --sessions "${{ inputs.sessions }}" \
            --output trial-output/reports
      - name: Upload isolated trial files to unique B2 prefix
        if: ${{ env.B2_ENDPOINT_URL != '' && env.B2_APPLICATION_KEY_ID != '' && env.B2_APPLICATION_KEY != '' && env.B2_BUCKET_NAME != '' }}
        env:
          ANALYSIS_DATE: ${{ inputs.analysis_date }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          import boto3
          from botocore.config import Config
          endpoint = os.environ["B2_ENDPOINT_URL"].rstrip("/")
          region = endpoint.split(".")[1]
          client = boto3.client(
              "s3", endpoint_url=endpoint, region_name=region,
              aws_access_key_id=os.environ["B2_APPLICATION_KEY_ID"],
              aws_secret_access_key=os.environ["B2_APPLICATION_KEY"],
              config=Config(signature_version="s3v4", s3={"addressing_style": "path"}),
          )
          bucket = os.environ["B2_BUCKET_NAME"]
          archive = next(Path("trial-output").glob("nifty-eod-trial-*.zip"))
          manifest = Path("trial-output/reports/trial-manifest.json")
          prefix = f"trial-downloads/{os.environ['ANALYSIS_DATE']}/run-{os.environ['RUN_ID']}"
          for path, name, content_type in [
              (archive, "reports.zip", "application/zip"),
              (manifest, "manifest.json", "application/json"),
          ]:
              body = path.read_bytes()
              client.put_object(
                  Bucket=bucket, Key=f"{prefix}/{name}", Body=body,
                  ContentType=content_type,
                  Metadata={"sha256": hashlib.sha256(body).hexdigest()},
              )
          print(f"Uploaded isolated trial objects to {prefix}/")
          PY
      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nifty-eod-trial-${{ inputs.analysis_date }}-${{ github.run_id }}
          path: trial-output/
          if-no-files-found: warn
          retention-days: 14
