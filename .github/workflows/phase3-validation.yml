name: Phase 3 storage and processing validation

on:
  push:
    branches:
      - phase3/storage-processing
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run Phase 3 and Phase 2 regression suites
        run: python -m pytest -q tests/test_phase3_storage.py tests/test_nse_ml_features.py tests/test_nifty_training_dataset.py tests/test_audit_nifty_prepared_datasets.py
