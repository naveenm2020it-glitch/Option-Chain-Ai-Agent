name: NIFTY Adaptive Intelligence V2 - Training Only

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nifty-v2-training-only.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: nifty-v2-training-only
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # 2026-11-16: B2-free training rerun using the existing verified 494-session checkpoint.
# Reuse the already verified historical checkpoint published on Nov 15.
      # This workflow does not contact Backblaze B2 or NSE.
      - name: Restore verified 494-session feature checkpoint
        uses: actions/download-artifact@v4
        with:
          name: nifty-historical-audit-43691154808
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 43691154808
          path: data

      - name: Verify checkpoint and core feature gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("data/historical_audit")
          checkpoint_path = root / "checkpoint.json"
          report_path = root / "coverage.json"
          if not checkpoint_path.is_file() or not report_path.is_file():
              raise SystemExit("Training blocked: verified audit checkpoint/report is missing.")
          checkpoint = json.loads(checkpoint_path.read_text())
          report = json.loads(report_path.read_text())
          if report.get("status") != "archive_integrity_complete_calendar_reconciled":
              raise SystemExit("Training blocked: archive integrity status is not complete.")
          if report.get("model_training_allowed") is not True:
              raise SystemExit("Training blocked: historical feature gate is closed.")
          if report.get("expected_session_count") != 494 or report.get("verified_session_count") != 494:
              raise SystemExit("Training blocked: expected 494 verified sessions.")
          if report.get("feature_session_count") != 494 or report.get("feature_error_count", 1) != 0:
              raise SystemExit("Training blocked: feature rows are incomplete or invalid.")
          if len(checkpoint.get("features", {})) != 494:
              raise SystemExit("Training blocked: checkpoint does not contain 494 feature rows.")
          print("Archive integrity: PASS (494/494)")
          print("Feature rows: PASS (494/494)")
          print("Feature source coverage:", json.dumps({
              "index_ohlc": report.get("index_data_coverage"),
              "participant_oi": report.get("participant_oi_coverage"),
              "participant_volume": report.get("participant_volume_coverage"),
          }, sort_keys=True))
          PY

      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ml.txt

      - name: Train NIFTY Adaptive Intelligence V2
        id: train
        run: |
          python scripts/train_adaptive_intelligence.py \
            --checkpoint data/historical_audit/checkpoint.json \
            --output-dir models/artifacts
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("models/artifacts")
          manifest_path = root / "model_manifest.json"
          model_path = root / "nifty_adaptive_v2.joblib"
          if not manifest_path.is_file() or not model_path.is_file():
              raise SystemExit("Training did not produce both model and manifest.")
          report = json.loads(manifest_path.read_text())
          print("Training output verified.")
          print("Model version:", report.get("model_version"))
          print("Deployment ready:", report.get("deployment_ready"))
          print("Direction metrics:", json.dumps(report.get("direction_holdout", {}), sort_keys=True))
          print("Seller model coverage:", json.dumps(report.get("seller_models", {}), sort_keys=True))
          if report.get("deployment_ready") is not True:
              print("WARNING: research candidate only; deployment gate remains closed.")
          PY

      - name: Publish trained model and reproducibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nifty-adaptive-v2-training-${{ github.run_id }}
          path: |
            models/artifacts/
          if-no-files-found: warn
          retention-days: 30
