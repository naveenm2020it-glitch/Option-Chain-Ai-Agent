name: Temporary FII XLS layout inspection

on:
  push:
    branches: [main]
    paths:
      - scripts/inspect_fii_layout.py

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas==2.2.3 xlrd==2.0.1
      - run: python scripts/inspect_fii_layout.py
