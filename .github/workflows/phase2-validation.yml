name: Phase 2 data pipeline validation

on:
  push:
    branches:
      - phase2/data-normalization
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip pytest "pandas>=2.2,<3"
      - name: Run Phase 2 regression suite
        run: python -m pytest -q tests/test_nse_ml_features.py tests/test_nifty_training_dataset.py

  prepare-historical-datasets:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/phase2/data-normalization'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download verified historical context checkpoint
        uses: actions/download-artifact@v4
        with:
          name: nifty-context-repair-44008350973
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 44008350973
          path: data
      - name: Verify checkpoint identity and session coverage
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          path = Path("data/historical_audit/checkpoint.json")
          raw = path.read_bytes()
          digest = hashlib.sha256(raw).hexdigest()
          expected = "29ec0d7718e92f29417094e9ee5c63ae0fc5096887faea238de898569d54320f"
          if digest != expected:
              raise SystemExit(f"Checkpoint SHA-256 mismatch: {digest}")
          checkpoint = json.loads(raw)
          rows = checkpoint.get("features", {})
          if len(rows) != 494:
              raise SystemExit(f"Expected 494 sessions, found {len(rows)}")
          print(f"Verified checkpoint: {len(rows)} sessions; SHA-256 {digest}")
          PY
      - name: Prepare chronological research datasets
        run: |
          python scripts/prepare_nifty_training_dataset.py \
            --checkpoint data/historical_audit/checkpoint.json \
            --output-dir data/prepared_models \
            --expected-sessions 494
      - name: Publish Phase 2 datasets and manifest
        uses: actions/upload-artifact@v4
        with:
          name: phase2-prepared-datasets-${{ github.run_id }}
          path: data/prepared_models/
          if-no-files-found: error
          retention-days: 30
      - name: Print Phase 2 dataset manifest
        run: cat data/prepared_models/manifest.json
