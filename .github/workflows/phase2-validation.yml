name: Phase 2 data pipeline validation

on:
  push:
    branches:
      - phase2/data-normalization
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip pytest "pandas>=2.2,<3"
      - name: Run Phase 2 regression suite
        run: python -m pytest -q tests/test_nse_ml_features.py tests/test_nifty_training_dataset.py
