name: NSE report download verification

on:
  push:
    branches: [main]
    paths:
      - "scripts/nse_download_check.py"
      - ".github/workflows/nse-download-check.yml"
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * 1-5"

permissions:
  contents: read

jobs:
  download-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install downloader dependency
        run: python -m pip install requests
      - name: Download latest available NSE EOD reports
        run: python scripts/nse_download_check.py --lookback-days 7 --output data/nse_reports
      - name: Upload report files and integrity manifest
        uses: actions/upload-artifact@v4
        with:
          name: nse-eod-report-download-${{ github.run_id }}
          path: data/nse_reports/
          retention-days: 7
