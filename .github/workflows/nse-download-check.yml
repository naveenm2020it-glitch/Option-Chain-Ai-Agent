name: NSE report download and durable archive
# Scheduled NIFTY-focused NSE report collection and archive validation.

on:
  push:
    branches: [main]
    paths:
      - "scripts/nse_download_check.py"
      - "scripts/archive_to_b2.py"
      - "storage.py"
      - "requirements.txt"
      - ".github/workflows/nse-download-check.yml"
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * 1-5"

permissions:
  contents: read

concurrency:
  group: nse-eod-collection
  cancel-in-progress: false

jobs:
  download-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      B2_ENDPOINT_URL: ${{ secrets.B2_ENDPOINT_URL }}
      B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
      APP_INGEST_URL: ${{ secrets.APP_INGEST_URL }}
      DAILY_INGEST_TOKEN: ${{ secrets.DAILY_INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Download latest available NSE EOD reports
        run: python scripts/nse_download_check.py --lookback-days 7 --output data/nse_reports
      - name: Persist daily report manifest in application database
        if: ${{ env.APP_INGEST_URL != '' && env.DAILY_INGEST_TOKEN != '' }}
        run: |
          python - <<'PY'
          import json, os, pathlib, requests
          manifest = json.loads(pathlib.Path("data/nse_reports/manifest.json").read_text())
          response = requests.post(
              os.environ["APP_INGEST_URL"].rstrip("/") + "/api/internal/daily-report",
              headers={"Authorization": "Bearer " + os.environ["DAILY_INGEST_TOKEN"]},
              json={"collection_date": manifest["requested_end_date"], "manifest": manifest},
              timeout=30,
          )
          response.raise_for_status()
          print("Persisted daily report metadata:", response.json())
          PY
      - name: Explain skipped database persistence
        if: ${{ env.APP_INGEST_URL == '' || env.DAILY_INGEST_TOKEN == '' }}
        run: echo "Database ingestion skipped: configure APP_INGEST_URL and DAILY_INGEST_TOKEN repository secrets."
      - name: Upload durable archive to Backblaze B2
        if: ${{ env.B2_ENDPOINT_URL != '' && env.B2_APPLICATION_KEY_ID != '' && env.B2_APPLICATION_KEY != '' && env.B2_BUCKET_NAME != '' }}
        run: python scripts/archive_to_b2.py --directory data/nse_reports --collection-date "$(date -u +%F)"
      - name: Explain skipped durable archive
        if: ${{ env.B2_ENDPOINT_URL == '' || env.B2_APPLICATION_KEY_ID == '' || env.B2_APPLICATION_KEY == '' || env.B2_BUCKET_NAME == '' }}
        run: echo "Backblaze B2 credentials are not configured. The temporary 7-day GitHub artifact will still be uploaded."
      - name: Upload temporary diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: nse-eod-report-download-${{ github.run_id }}
          path: data/nse_reports/
          retention-days: 7
