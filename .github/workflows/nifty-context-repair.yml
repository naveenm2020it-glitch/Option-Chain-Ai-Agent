name: NIFTY historical missing-context repair (B2-free)

on:
  workflow_dispatch:
    inputs:
      delay_seconds:
        description: "Delay between NSE report requests"
        required: true
        default: "0.35"
        type: string
  push:
    branches: [main]
    paths:
      - "scripts/nse_context_repair.py"
      - ".github/workflows/nifty-context-repair.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: nifty-context-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # Recover the already verified checkpoint from GitHub Actions.
      # This job has no B2 credentials and never reads/writes Backblaze.
      - name: Restore verified 494-session checkpoint
        uses: actions/download-artifact@v4
        with:
          name: nifty-historical-audit-43691154808
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 43691154808
          path: data

      - name: Verify historical checkpoint before repair
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("data/historical_audit")
          cp = json.loads((root / "checkpoint.json").read_text())
          report = json.loads((root / "coverage.json").read_text())
          assert report.get("status") == "archive_integrity_complete_calendar_reconciled"
          assert report.get("verified_session_count") == 494
          assert report.get("feature_session_count") == 494
          assert len(cp.get("features", {})) == 494
          assert report.get("feature_error_count") == 0
          print("Archive integrity PASS: 494/494. No B2 re-scan required.")
          PY

      - name: Install lightweight NSE parsing dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-audit.txt

      - name: Repair missing historical NSE context data
        id: repair
        run: |
          python scripts/nse_context_repair.py \
            --checkpoint data/historical_audit/checkpoint.json \
            --output-dir data/context_repair \
            --delay-seconds "${{ inputs.delay_seconds || '0.35' }}"

      - name: Publish repaired checkpoint, source files and coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nifty-context-repair-${{ github.run_id }}
          path: |
            data/historical_audit/checkpoint.json
            data/context_repair/
          if-no-files-found: warn
          retention-days: 30
