name: NIFTY AI checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run 30 consecutive Python and JavaScript validation cycles
        run: |
          for iteration in $(seq 1 30); do
            echo "===== VALIDATION CYCLE ${iteration}/30 ====="
            python -m pytest -q
            node --check static/app.js
          done
          echo "All 30 validation cycles passed."
