name: NIFTY AI checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx
      - name: Run unit, integration, API and regression tests
        env:
          PYTHONPATH: .
          NIFTY_APP_PASSWORD: ""
          NIFTY_ENABLE_WATCHER: "false"
        run: python -m pytest -q --ignore=tests/e2e
      - name: JavaScript syntax validation
        run: node --check static/app.js
