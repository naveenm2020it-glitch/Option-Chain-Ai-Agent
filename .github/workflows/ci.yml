name: CI
on:
  push:
    branches:
      - main
      - "model-tuning/**"
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: One-date NSE live report download and parser test (PR #26 only)
        if: github.event.pull_request.number == 26
        run: python scripts/system1_sample_test.py --date 2026-01-07
