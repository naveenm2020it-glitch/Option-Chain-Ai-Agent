name: NIFTY Adaptive Intelligence V2 - Four Model Training

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/train_nifty_four_models.py"
      - "tests/test_nifty_four_models.py"
      - "requirements-four-models.txt"
      - ".github/workflows/nifty-four-model-training.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: nifty-four-model-training
  cancel-in-progress: true

jobs:
  train-four-models:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # This audit artifact contains the independent archive-integrity report.
      # It was created by the earlier verified audit; no B2 request is made here.
      - name: Restore verified historical audit report (GitHub artifact only)
        uses: actions/download-artifact@v4
        with:
          name: nifty-historical-audit-43691154808
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 43691154808
          path: data

      # This artifact contains the repaired checkpoint and the final 5/22 context
      # repair validation report. Downloading it does not access B2 or NSE.
      - name: Restore final repaired 494-session archive (GitHub artifact only)
        uses: actions/download-artifact@v4
        with:
          name: nifty-context-repair-43805612526
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 43805612526
          path: data

      - name: Verify archive, repair, provenance and no-imputation gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("data/historical_audit")
          checkpoint = json.loads((root / "checkpoint.json").read_text())
          audit = json.loads((root / "coverage.json").read_text())
          repair = json.loads(Path("data/context_repair/context_repair_report.json").read_text())

          assert audit.get("status") == "archive_integrity_complete_calendar_reconciled"
          assert audit.get("model_training_allowed") is True
          assert audit.get("expected_session_count") == 494
          assert audit.get("verified_session_count") == 494
          assert audit.get("feature_session_count") == 494
          assert audit.get("feature_error_count") == 0
          assert len(checkpoint.get("features", {})) == 494
          assert sorted(checkpoint["features"]) == sorted(audit.get("verified_dates", []))

          assert repair.get("repair_complete") is True
          assert repair.get("training_allowed") is True
          assert repair.get("date_count") == 494
          assert repair.get("date_alignment_pass") is True
          assert repair.get("feature_validation", {}).get("pass") is True
          assert repair.get("feature_validation", {}).get("error_count") == 0
          assert repair.get("b2_requests") == 0
          assert repair.get("missing_context_dates") == {}
          assert all(float(v) >= 0.95 for v in repair.get("coverage", {}).values())

          print("Archive integrity: PASS (494/494)")
          print("Repair/date alignment/feature validation: PASS")
          print("Context coverage:", json.dumps(repair.get("coverage"), sort_keys=True))
          print("B2 calls: 0 reads / 0 writes")
          print("Missing-value policy:", repair.get("missing_value_policy"))
          PY

      - name: Install four-model training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-four-models.txt

      - name: Test the shared rolling feature engine
        run: python -m pytest -q tests/test_nifty_four_models.py

      - name: Train exactly four NIFTY model groups
        run: |
          python scripts/train_nifty_four_models.py \
            --checkpoint data/historical_audit/checkpoint.json \
            --audit-report data/historical_audit/coverage.json \
            --repair-report data/context_repair/context_repair_report.json \
            --output-dir models/four_model_artifacts

      - name: Verify model bundle and print validation results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import joblib

          root = Path("models/four_model_artifacts")
          manifest = json.loads((root / "four_model_manifest.json").read_text())
          bundle = joblib.load(root / "nifty_four_models.joblib")

          assert manifest.get("model_group_count") == 4
          assert manifest.get("model_groups") == ["direction", "range", "CE_seller", "PE_seller"]
          assert manifest.get("historical_sessions") == 494
          assert manifest.get("eligible_daily_samples") >= 400
          assert manifest.get("rolling_windows", {}).get("recent")
          assert manifest.get("rolling_windows", {}).get("monthly")
          assert manifest.get("b2_reads") == 0 and manifest.get("b2_writes") == 0
          required_models = {"direction_model", "range_model", "ce_seller_model", "pe_seller_model"}
          assert required_models.issubset(bundle.keys())
          assert Path(root / manifest["model_file"]).is_file()

          print("Four model objects: PASS")
          print("Daily samples:", manifest["eligible_daily_samples"])
          print("Rolling features:", manifest["rolling_feature_count"])
          print("Direction holdout:", json.dumps(manifest["direction"]["holdout"], sort_keys=True))
          print("Direction baseline:", json.dumps(manifest["direction"]["baseline"], sort_keys=True))
          print("Range holdout:", json.dumps(manifest["range"]["holdout"], sort_keys=True))
          print("CE seller:", json.dumps(manifest["ce_seller"], sort_keys=True))
          print("PE seller:", json.dumps(manifest["pe_seller"], sort_keys=True))
          print("Research validation PASS:", manifest["research_validation_pass"])
          print("Deployment ready:", manifest["deployment_ready"])
          print("B2 usage:", manifest["b2_reads"], "reads /", manifest["b2_writes"], "writes")
          PY

      - name: Publish four-model bundle and full validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nifty-four-model-training-${{ github.run_id }}
          path: |
            models/four_model_artifacts/
          if-no-files-found: warn
          retention-days: 30
