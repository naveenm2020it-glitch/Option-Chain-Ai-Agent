services:
  - type: web
    name: option-chain-ai-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: NSE_ENABLED
        value: "false"
      - key: JUGAAD_PROVIDER_ENABLED
        value: "false"
      - key: JUGAAD_AUTOMATED_USE_PERMITTED
        value: "false"
