services:
  - type: web
    name: option-chain-ai-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: NSE_ENABLED
        value: "false"
      - key: NSE_AUTOMATED_COLLECTION_ENABLED
        value: "false"
      - key: ORDER_EXECUTION_ENABLED
        value: "false"
      - key: ANALYTICS_UPDATE_INTERVAL_SECONDS
        value: "3"
      - key: DASHBOARD_HEARTBEAT_SECONDS
        value: "3"
      - key: PROVIDER_POLL_INTERVAL_SECONDS
        value: "5"
      - key: PROVIDER_CACHE_TTL_SECONDS
        value: "5"
      - key: MCP_PROVIDER_ENABLED
        value: "false"
      - key: MCP_AUTOMATED_USE_PERMITTED
        value: "false"
      - key: JUGAAD_PROVIDER_ENABLED
        value: "false"
      - key: JUGAAD_AUTOMATED_USE_PERMITTED
        value: "false"
      - key: FYERS_PROVIDER_ENABLED
        value: "false"
      - key: FYERS_APP_ID
        sync: false
      - key: FYERS_ACCESS_TOKEN
        sync: false
      - key: FYERS_REST_REFRESH_SECONDS
        value: "60"
      - key: FYERS_STANDARD_STRIKE_COUNT
        value: "24"
      - key: FYERS_MAX_AGE_SECONDS
        value: "30"
