services:
  - type: web
    name: nifty-next-day-ai
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: NIFTY_APP_PASSWORD
        sync: false
      - key: NIFTY_ENABLE_WATCHER
        value: "false"
      - key: NIFTY_DATA_DIR
        value: /tmp/nifty-ai-data
      - key: NIFTY_INCOMING_DIR
        value: /tmp/nifty-ai-data/incoming
