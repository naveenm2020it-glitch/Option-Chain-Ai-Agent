services:
  - type: web
    name: option-chain-ai-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DISABLE_FOLDER_WATCHER
        value: "true"
      - key: MAX_UPLOAD_MB
        value: "80"
